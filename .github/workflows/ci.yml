
name: Tasker CI Pipeline

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate, Build and Scan
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python and dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      # 3. Run code-quality checks
      - name: Run Ruff
        run: ruff check app tests run.py

      # 4. Run automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # 5. Build Docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tasker:ci-${{ github.sha }}

      # 6. Scan Docker image for vulnerabilities
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tasker:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # 7. Publish only validated releases tagged from main
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish versioned Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tasker:${{ github.ref_name }}
