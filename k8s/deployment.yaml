apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasker
spec:
  replicas: 2

  selector:
    matchLabels:
      app: tasker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: tasker

    spec:
      containers:
        - name: tasker
          image: fahmiizzuddin182/tasker:v1.0.1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tasker-config
                  key: PORT

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tasker-secret
                  key: DATABASE_URL

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
